# Produkce: aplikace + Postgres. Tajné hodnoty v .env vedle tohoto souboru (viz web/.env.example).
# Spuštění: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  app:
    build: ./web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kalkulacka:${DB_PASSWORD}@db:5432/kalkulacka
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM}
      INTERNAL_URL: http://127.0.0.1:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    init: true
    ipc: host
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kalkulacka
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kalkulacka
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalkulacka"]
      interval: 5s
      retries: 20
volumes:
  dbdata:
