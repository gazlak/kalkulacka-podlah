name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: kalkulacka, POSTGRES_PASSWORD: kalkulacka, POSTGRES_DB: kalkulacka }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalkulacka" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://kalkulacka:kalkulacka@localhost:5432/kalkulacka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (mock)
        run: E2E_API=mock npx playwright test
      - name: E2E (http + PostgreSQL)
        run: E2E_API=http npx playwright test
