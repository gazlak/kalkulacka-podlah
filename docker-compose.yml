# Vývoj: Postgres + Mailpit (zachytává odeslané e-maily na http://localhost:8025).
# Obsazené porty jde přesměrovat: DB_PORT, SMTP_DEV_PORT, MAILPIT_PORT (pak upravit i web/.env.local).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kalkulacka
      POSTGRES_PASSWORD: kalkulacka
      POSTGRES_DB: kalkulacka
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalkulacka"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports: ["${SMTP_DEV_PORT:-1025}:1025", "${MAILPIT_PORT:-8025}:8025"]
volumes:
  dbdata:
