# Vývoj: Postgres + Mailpit (zachytává odeslané e-maily na http://localhost:8025).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kalkulacka
      POSTGRES_PASSWORD: kalkulacka
      POSTGRES_DB: kalkulacka
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalkulacka"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  dbdata:
